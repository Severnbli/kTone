server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Not in nginx's default mime.types.
    types {
        application/manifest+json webmanifest;
    }
    include /etc/nginx/mime.types;

    # Hashed build assets (bundles, CSS, .wasm) never change: cache forever.
    # A missing file is a 404, never index.html, so the service worker's
    # precache fails loudly instead of storing HTML under a .js URL.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else has a stable URL and must always be revalidated:
    # index.html, sw.js (a stale worker would pin users to an old build),
    # pitch-worklet.js, the manifest and the icons. The SPA fallback below
    # is an internal redirect to /index.html, which lands here again.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
