server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Not in nginx's default mime.types.
    types {
        application/manifest+json webmanifest;
    }
    include /etc/nginx/mime.types;
    charset utf-8;
    charset_types text/plain text/xml application/xml application/manifest+json;

    # Hashed build assets (bundles, CSS, .wasm) never change: cache forever.
    # A missing file is a 404, never index.html, so the service worker's
    # precache fails loudly instead of storing HTML under a .js URL.
    # `^~` keeps the regex location below from taking these paths.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Any other path whose last segment has an extension is a file request:
    # index.html, sw.js, pitch-worklet.js, the manifest, icons, robots.txt,
    # sitemap.xml, og-image.png. A missing one is a real 404 instead of the
    # SPA page, so crawlers never see HTML under a .txt/.xml/.png URL.
    # These URLs are stable and must always be revalidated (a stale sw.js
    # would pin users to an old build).
    location ~ \.[A-Za-z0-9]+$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Navigations (no extension) get the SPA. The fallback is an internal
    # redirect to /index.html, which is served by the location above.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
